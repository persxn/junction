[package]
name = "compintel"
version = "0.10.0"
description = "Junction desktop shell: window, tray and backend supervision"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
# The binary is a three-line wrapper so the whole shell can be unit-tested.
name = "compintel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what §4.1 calls Tauri's built-in tray; nothing else is enabled.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# Used from Rust only (ruling R43): the wizard's folder picker. Its JavaScript
# API is deliberately not exposed to the page.
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
# R90/WP-23: Windows toasts for CRITICAL notifications; pinned exactly.
tauri-winrt-notification = "=0.8.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # CreateJobObjectW takes SECURITY_ATTRIBUTES, which lives behind this feature.
  "Win32_Security",
  # DPAPI: the session data key is sealed to this Windows account (ruling R76).
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # ShellExecuteW opens a link in the default browser (§13, ruling R78).
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
incremental = true
